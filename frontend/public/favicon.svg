<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- 品牌渐变 - 温暖的橙色系 -->
    <linearGradient id="bowlGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <!-- 内发光效果 -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="32" cy="32" r="30" fill="url(#bowlGradient)"/>

  <!-- 碗的主体 -->
  <g transform="translate(32, 38)">
    <!-- 碗的底部曲线 -->
    <path d="M-20,8 Q-22,20 -12,26 Q0,30 12,26 Q22,20 20,8"
          fill="#FFFFFF"
          stroke="none"/>
    <!-- 碗的顶部开口 -->
    <ellipse cx="0" cy="8" rx="20" ry="6" fill="#FFFFFF"/>
    <!-- 碗内部的渐变遮罩 -->
    <ellipse cx="0" cy="10" rx="16" ry="4" fill="url(#innerGlow)"/>
  </g>

  <!-- 碗沿的高光 -->
  <ellipse cx="32" cy="38" rx="20" ry="6" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.5"/>

  <!-- "遇"的意象 - 两颗小星星/火花 -->
  <g fill="#FFFFFF">
    <!-- 主星星 -->
    <path d="M32,18 L34,23 L39,23 L35,26 L37,31 L32,28 L27,31 L29,26 L25,23 L30,23 Z"
          opacity="0.95"/>
    <!-- 小星星 -->
    <circle cx="22" cy="24" r="2" opacity="0.7"/>
    <circle cx="42" cy="24" r="1.5" opacity="0.6"/>
    <!-- 闪光线条 -->
    <line x1="38" y1="14" x2="40" y2="12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="26" y1="16" x2="24" y2="14" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 底部投影增强立体感 -->
  <ellipse cx="32" cy="58" rx="12" ry="3" fill="#000000" opacity="0.1"/>
</svg>
