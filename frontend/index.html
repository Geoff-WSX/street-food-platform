<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA -->
    <meta name="theme-color" content="#667eea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="食遇" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- 描述 -->
    <meta name="description" content="发现身边的美食，分享你的味蕾故事" />
    <meta name="keywords" content="美食,街边小吃,美食推荐,美食分享,食遇" />

    <!-- Open Graph -->
    <meta property="og:title" content="食遇 - 发现身边的美食" />
    <meta property="og:description" content="发现身边的美食，分享你的味蕾故事" />
    <meta property="og:type" content="website" />

    <title>食遇 - 发现身边的美食</title>

    <!-- 引入高德地图 JavaScript API -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=333c34192208527e8d2a2e574d1e9693"></script>

    <!-- 注册 Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
