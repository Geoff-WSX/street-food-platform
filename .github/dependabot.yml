version: 2
updates:
  # 前端依赖更新
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    versioning-strategy: increase
    reviewers:
      - "Geoff-WSX"
    labels:
      - "dependencies"
      - "frontend"

  # 后端依赖更新
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    versioning-strategy: increase
    reviewers:
      - "Geoff-WSX"
    labels:
      - "dependencies"
      - "backend"

  # GitHub Actions 更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "ci"
      - "dependencies"
